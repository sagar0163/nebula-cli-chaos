# Example: Chaos Testing with Nebula CLI
# Copy this file to .github/workflows/chaos.yml in your repository

name: Chaos Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  chaos:
    name: Run Chaos Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Nebula Chaos Tests
        uses: sagar0163/nebula-cli-chaos/action@main
        with:
          command: 'node my-cli.js'
          profile: 'standard'
          timeout: '15000'
          fail-on-failure: 'true'
          post-comment: 'true'

  chaos-matrix:
    name: Chaos Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Nebula Chaos Tests
        uses: sagar0163/nebula-cli-chaos/action@main
        with:
          command: 'node my-cli.js'
          profile: 'standard'
